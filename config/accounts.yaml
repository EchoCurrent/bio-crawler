# 采集设置
crawler:
  max_articles_per_account: 10      # 每个号最多采集最近几篇
  request_delay: 3                  # 请求间隔(秒)
  headless: true                    # 无头浏览器
  max_retries: 3                    # 失败重试次数

# AI摘要
summarizer:
  enabled: true
  api_key: "your-kimi-api-key-here"  # 替换为你的Kimi API Key
  model: "kimi-k3"
  max_content_length: 8000          # 发送给AI的最大字符数
  api_base: "https://api.moonshot.cn/v1"  # Kimi API地址

# 通知
notifier:
  # 控制台输出 (默认，建议开启)
  console:
    enabled: true

  # 邮件推送 (可选)
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "your-email@gmail.com"
    password: "your-app-password"    # Gmail需要使用应用专用密码
    to: ["you@example.com"]
    subject_prefix: "[公众号更新]"

  # 企业微信机器人 (可选)
  wecom:
    enabled: false
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your-key-here"

# 存储
storage:
  db_path: "data/wechat.db"
  image_dir: "data/images"
  keep_images: true                 # 是否下载图片
  image_subdir_by_account: true     # 按公众号分文件夹存储图片

# 定时任务
scheduler:
  enabled: false                    # 是否启用内置定时任务
  run_time: "09:00"                 # 每天运行时间 (HH:MM)
  timezone: "Asia/Shanghai"
